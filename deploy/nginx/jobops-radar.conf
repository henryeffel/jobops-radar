server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jobjobs.shop www.jobjobs.shop;

    ssl_certificate /etc/letsencrypt/live/jobjobs.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobjobs.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/jobops-radar/current;
    index index.html;
    client_max_body_size 2m;

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(auth|users|job-analyses|job-postings)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    location ~ ^/(health|docs|redoc|openapi\.json)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name jobjobs.shop www.jobjobs.shop;

    return 301 https://$host$request_uri;
}
